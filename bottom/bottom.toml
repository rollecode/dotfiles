# Tokyo Night, same palette as tmux/tmux.conf.

[styles.cpu]
all_entry_colour = "#c0caf5"
avg_entry_colour = "#f7768e"
cpu_core_colours = ["#7aa2f7", "#bb9af7", "#7dcfff", "#9ece6a", "#e0af68", "#73daca", "#ff9e64", "#2ac3de"]

[styles.temp_graph]
temp_graph_colour_styles = ["#7aa2f7", "#bb9af7", "#7dcfff", "#9ece6a", "#e0af68", "#73daca", "#ff9e64", "#2ac3de"]

[styles.memory]
ram_colour = "#bb9af7"
cache_colour = "#7dcfff"
swap_colour = "#e0af68"
arc_colour = "#73daca"
gpu_colours = ["#7aa2f7", "#9ece6a", "#ff9e64", "#2ac3de"]

[styles.network]
rx_colour = "#7aa2f7"
tx_colour = "#bb9af7"
rx_total_colour = "#7dcfff"
tx_total_colour = "#9ece6a"

[styles.battery]
high_battery_colour = "#9ece6a"
medium_battery_colour = "#e0af68"
low_battery_colour = "#f7768e"

[styles.tables]
headers = { colour = "#7aa2f7", bold = true }

[styles.graphs]
graph_colour = "#565f89"
legend_text = { colour = "#a9b1d6" }

[styles.widgets]
border_colour = "#3b4261"
selected_border_colour = "#bb9af7"
widget_title = { colour = "#7aa2f7", bold = true }
text = { colour = "#c0caf5" }
selected_text = { colour = "#1a1b26", bg_colour = "#bb9af7" }
disabled_text = { colour = "#565f89" }
thread_text = { colour = "#9ece6a" }
