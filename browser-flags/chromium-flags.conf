# ANGLE backend on NVIDIA Wayland (nvidia-open). Tradeoffs found the hard way:
#   vulkan  - hung the whole GPU (Xid 38 "driver firmware error", RC watchdog
#             could not recover, full freeze). Dropped 2.8.2026 after daily
#             freezes; Chromium+Vulkan+NVIDIA+Wayland is a known lockup combo.
#   gl      - stable, no hang; minor opaque-overlay corruption is the price.
#   egl     - silently drops the GPU process to software rendering.
# A GPU hang is far worse than a cosmetic overlay glitch, so: gl.
# If overlay corruption is unacceptable, fall back to --disable-gpu (software,
# no hang possible) rather than back to vulkan.
--ozone-platform=wayland
--enable-features=UseOzonePlatform,WaylandWindowDecorations,WebRTCPipeWireCapturer
--disable-features=WaylandFractionalScaleV1,UseChromeOSDirectVideoDecoder
--password-store=basic
--use-gl=angle
--use-angle=gl
--ignore-gpu-blocklist
--enable-gpu-rasterization
--canvas-oop-rasterization
--disable-background-networking
--disable-component-update
