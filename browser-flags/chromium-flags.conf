# GL backend: left to Chromium's default. Forcing --use-angle=gl was stable but
# noticeably slow (extra ANGLE translation), so the default path is used instead,
# accepting the occasional opaque-overlay flicker on NVIDIA Wayland as the price
# of speed.
#
# NEVER add --use-angle=vulkan: it hung the whole GPU on nvidia-open (Xid 38
# firmware error, RC watchdog could not recover, hard freeze needing a forced
# reboot). Chromium does not pick Vulkan on its own on Linux, so the default is
# safe. If flicker becomes unbearable, --disable-gpu (software, no hang) is the
# fallback, not vulkan. Dropped 2.8.2026 after daily freezes.
--ozone-platform=wayland
--enable-features=UseOzonePlatform,WaylandWindowDecorations,WebRTCPipeWireCapturer
--disable-features=WaylandFractionalScaleV1,UseChromeOSDirectVideoDecoder
--password-store=basic
--ignore-gpu-blocklist
--enable-gpu-rasterization
--canvas-oop-rasterization
--disable-background-networking
--disable-component-update
