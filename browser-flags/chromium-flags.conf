# Chromium 150 allows only three GL backends, all via ANGLE:
# opengl and opengles both corrupt opaque overlays on NVIDIA Wayland, and
# --use-gl=egl silently kills the GPU process (everything drops to software).
# Vulkan is the last one; its earlier black-window test was run with a
# conflicting --use-angle=gl still in this file, so it was never valid.
--ozone-platform=wayland
--enable-features=UseOzonePlatform,WaylandWindowDecorations,WebRTCPipeWireCapturer
--disable-features=WaylandFractionalScaleV1,UseChromeOSDirectVideoDecoder
--password-store=basic
--use-gl=angle
--use-angle=vulkan
--ignore-gpu-blocklist
--enable-gpu-rasterization
--canvas-oop-rasterization
--disable-background-networking
--disable-component-update
