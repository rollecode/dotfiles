# The list form of a hot corner (alternating actions) needs a build that
# understands it, so it is staged in pending-hot-corners.toml and swapped into
# the live config here, just before the new binary starts. Idempotent: it only
# rewrites lines that still hold the old single-action form.
[Service]
ExecStartPre=-/bin/sh -c 'C=%h/.config/driftwm/config.toml; P=%h/.config/driftwm/pending-hot-corners.toml; [ -f "$P" ] || exit 0; while IFS= read -r line; do case "$line" in \\#*|"") continue;; esac; k=${line%%%% =*}; grep -q "^$k = " "$C" && sed -i "s|^$k = .*|$line|" "$C"; done < "$P"; true'
